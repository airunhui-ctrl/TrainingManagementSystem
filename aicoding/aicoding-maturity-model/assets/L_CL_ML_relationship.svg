<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 340" width="1440" height="680" xmlns="http://www.w3.org/2000/svg" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;">
  <rect width="720" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a6c83"/></marker>
  </defs>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2332">两层评估结构：L1-L3（全 PA）+ L4-L5（仅改进类）→ ML1-5</text>

  <!-- Column 1: L1-L5 -->
  <text x="120" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6c83">实践条目分级</text>
  <rect x="45" y="62" width="150" height="28" rx="5" fill="#94a3b8"/><text x="120" y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">L1 基础执行</text>
  <rect x="45" y="94" width="150" height="28" rx="5" fill="#60a5fa"/><text x="120" y="113" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">L2 项目级管理</text>
  <rect x="45" y="126" width="150" height="28" rx="5" fill="#2563eb"/><text x="120" y="145" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">L3 组织级标准</text>
  <rect x="45" y="158" width="150" height="28" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3"/><text x="120" y="177" text-anchor="middle" font-size="10" fill="#0d9488" font-weight="600">L4 量化管理（仅 AMP）</text>
  <rect x="45" y="190" width="150" height="28" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/><text x="120" y="209" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">L5 优化创新（仅 ACA/ACI）</text>

  <!-- Arrows col1→col2 -->
  <path d="M 198 76 L 425 76" stroke="#5a6c83" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 198 108 L 425 108" stroke="#5a6c83" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 198 140 L 425 140" stroke="#5a6c83" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 198 172 L 425 172" stroke="#5a6c83" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 198 204 L 425 204" stroke="#5a6c83" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="312" y="68" text-anchor="middle" font-size="9" fill="#5a6c83">所有 PA 满足 Ln</text>
  <text x="312" y="80" text-anchor="middle" font-size="9" fill="#5a6c83">即达 MLn</text>

  <!-- Column 2: ML -->
  <text x="510" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6c83">成熟度等级（组织级）</text>
  <rect x="425" y="62" width="170" height="28" rx="5" fill="#94a3b8"/><text x="510" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">ML1 所有 PA 满足 L1</text>
  <rect x="425" y="94" width="170" height="28" rx="5" fill="#60a5fa"/><text x="510" y="108" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">ML2 所有 PA 满足 L1+L2</text>
  <rect x="425" y="126" width="170" height="28" rx="5" fill="#2563eb"/><text x="510" y="140" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">ML3 所有 PA 满足 L1-L3</text>
  <rect x="425" y="158" width="170" height="28" rx="5" fill="#0d9488"/><text x="510" y="172" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">ML4 ML3 + AMP 的 L4</text>
  <rect x="425" y="190" width="170" height="28" rx="5" fill="#7c3aed"/><text x="510" y="204" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">ML5 ML4 + ACA/ACI 的 L5</text>

  <!-- Bottom summary -->
  <rect x="45" y="240" width="550" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="262" font-size="10.5" fill="#2563eb" font-weight="700">L1-L5</text>
  <text x="100" y="262" font-size="10.5" fill="#5a6c83">实践条目分级，回答"每个 PA 做了什么"；L1-L3 全 PA 正式定义，L4-L5 仅改进类 PA</text>
  <text x="60" y="282" font-size="10.5" fill="#7c3aed" font-weight="700">ML1-5</text>
  <text x="100" y="282" font-size="10.5" fill="#5a6c83">成熟度等级，回答"组织整体 AI 编码能力处于什么水平"（所有 PA 满足对应 Ln + 指标达标）</text>
</svg>
