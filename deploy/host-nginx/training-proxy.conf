# ============================================================ # 培训管理系统 · Nginx 反向代理配置 # 文件位置：/etc/nginx/conf.d/training-proxy.conf # # 作用：将三个子域名通过 80 端口分发到对应的 Docker 容器端口。 # 宿主机 nginx 只做域名 -> 端口的转发，容器内部 nginx 负责 # 静态文件服务 + /api/ 反向代理到 API 容器。 # ============================================================  # --- 测评工具 (AICoding) --- server {     server_name aicoding.lbx.fj.cn;      client_max_body_size 10m;      location / {         proxy_pass http://127.0.0.1:18082;         proxy_http_version 1.1;         proxy_set_header Host              $host;         proxy_set_header X-Real-IP         $remote_addr;         proxy_set_header X-Forwarded-For   $remote_addr;         proxy_set_header X-Forwarded-Proto $scheme;     }      listen 443 ssl; # managed by Certbot     ssl_certificate /etc/letsencrypt/live/aicoding.lbx.fj.cn/fullchain.pem; # managed by Certbot     ssl_certificate_key /etc/letsencrypt/live/aicoding.lbx.fj.cn/privkey.pem; # managed by Certbot     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot  }  # --- 管理端 (Admin) --- server {     server_name kcpc.lbx.fj.cn;      client_max_body_size 10m;      location / {         proxy_pass http://127.0.0.1:18080;         proxy_http_version 1.1;         proxy_set_header Host              $host;         proxy_set_header X-Real-IP         $remote_addr;         proxy_set_header X-Forwarded-For   $remote_addr;         proxy_set_header X-Forwarded-Proto $scheme;     }      listen 443 ssl; # managed by Certbot     ssl_certificate /etc/letsencrypt/live/aicoding.lbx.fj.cn/fullchain.pem; # managed by Certbot     ssl_certificate_key /etc/letsencrypt/live/aicoding.lbx.fj.cn/privkey.pem; # managed by Certbot     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot  }  # --- H5 移动端 --- server {     server_name kch5.lbx.fj.cn;      client_max_body_size 10m;      location / {         proxy_pass http://127.0.0.1:18081;         proxy_http_version 1.1;         proxy_set_header Host              $host;         proxy_set_header X-Real-IP         $remote_addr;         proxy_set_header X-Forwarded-For   $remote_addr;         proxy_set_header X-Forwarded-Proto $scheme;     }      listen 443 ssl; # managed by Certbot     ssl_certificate /etc/letsencrypt/live/aicoding.lbx.fj.cn/fullchain.pem; # managed by Certbot     ssl_certificate_key /etc/letsencrypt/live/aicoding.lbx.fj.cn/privkey.pem; # managed by Certbot     include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot  } server {     if ($host = aicoding.lbx.fj.cn) {         return 301 https://$host$request_uri;     } # managed by Certbot       listen 80;     server_name aicoding.lbx.fj.cn;     return 404; # managed by Certbot   } server {     if ($host = kcpc.lbx.fj.cn) {         return 301 https://$host$request_uri;     } # managed by Certbot       listen 80;     server_name kcpc.lbx.fj.cn;     return 404; # managed by Certbot   } server {     if ($host = kch5.lbx.fj.cn) {         return 301 https://$host$request_uri;     } # managed by Certbot       listen 80;     server_name kch5.lbx.fj.cn;     return 404; # managed by Certbot   }